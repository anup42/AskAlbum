version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      android-build:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
      androidx:
        patterns:
          - "androidx.*"
      testing:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

