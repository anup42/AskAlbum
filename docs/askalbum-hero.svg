<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AskAlbum</title>
  <desc id="desc">Private on-device AI photo search for Android</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071B1A"/>
      <stop offset="0.58" stop-color="#0B3531"/>
      <stop offset="1" stop-color="#14594F"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C873"/>
      <stop offset="1" stop-color="#E66B4E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00110F" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="36" fill="url(#background)"/>
  <circle cx="1130" cy="-12" r="250" fill="#6BC9B5" opacity="0.08"/>
  <circle cx="80" cy="610" r="260" fill="#F7C873" opacity="0.07"/>
  <path d="M0 470 C250 390 375 600 650 510 C930 420 1040 535 1280 430 L1280 640 L0 640 Z" fill="#6BC9B5" opacity="0.055"/>

  <g transform="translate(78 74)">
    <rect x="0" y="0" width="76" height="76" rx="22" fill="#F7C873"/>
    <rect x="16" y="16" width="44" height="44" rx="12" fill="#0B3531"/>
    <circle cx="29" cy="29" r="6" fill="#F7C873"/>
    <path d="M20 52 L34 38 L43 47 L50 40 L58 52 Z" fill="#F7C873"/>
  </g>

  <text x="180" y="123" fill="#F5F2E9" font-family="Georgia, serif" font-size="66" font-weight="700" letter-spacing="-1">AskAlbum</text>
  <text x="82" y="213" fill="#F5F2E9" font-family="Arial, sans-serif" font-size="32" font-weight="600">Ask your photos anything.</text>
  <text x="82" y="256" fill="#9DE2D2" font-family="Arial, sans-serif" font-size="25">Private. Offline. Grounded in your media.</text>

  <g transform="translate(82 306)">
    <rect width="610" height="82" rx="23" fill="url(#glass)" stroke="#9DE2D2" stroke-opacity="0.35"/>
    <circle cx="42" cy="41" r="15" fill="none" stroke="#F7C873" stroke-width="4"/>
    <path d="M53 52 L66 65" stroke="#F7C873" stroke-width="4" stroke-linecap="round"/>
    <text x="86" y="49" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22">Show birthday photos with my family</text>
  </g>

  <g transform="translate(82 414)" font-family="Arial, sans-serif" font-size="16" font-weight="600">
    <rect width="152" height="44" rx="22" fill="#F7C873"/>
    <text x="25" y="28" fill="#17352F">ON-DEVICE AI</text>
    <rect x="168" width="170" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="194" y="28" fill="#D5F4ED">NO CLOUD INFERENCE</text>
    <rect x="354" width="156" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="382" y="28" fill="#D5F4ED">OPEN SOURCE</text>
  </g>

  <g transform="translate(770 78)" filter="url(#shadow)">
    <g transform="rotate(-8 176 226)">
      <rect x="4" y="20" width="340" height="444" rx="30" fill="#DCEFEA" opacity="0.28"/>
    </g>
    <g transform="rotate(7 190 225)">
      <rect x="38" y="8" width="340" height="444" rx="30" fill="#F5E5C7" opacity="0.34"/>
    </g>
    <rect x="18" y="24" width="370" height="470" rx="34" fill="#F5F2E9"/>
    <rect x="42" y="48" width="322" height="298" rx="22" fill="url(#photo)"/>
    <circle cx="291" cy="116" r="38" fill="#FFF3C9" opacity="0.82"/>
    <path d="M42 273 L124 188 L191 254 L245 202 L364 310 L364 346 L42 346 Z" fill="#0C4D45" opacity="0.78"/>
    <path d="M42 304 L135 232 L216 306 L272 262 L364 329 L364 346 L42 346 Z" fill="#082E2A" opacity="0.76"/>
    <rect x="42" y="370" width="254" height="15" rx="8" fill="#183B36" opacity="0.85"/>
    <rect x="42" y="402" width="299" height="11" rx="6" fill="#6A7E79" opacity="0.45"/>
    <rect x="42" y="426" width="232" height="11" rx="6" fill="#6A7E79" opacity="0.32"/>
    <rect x="281" y="451" width="83" height="24" rx="12" fill="#D8F0E9"/>
    <text x="299" y="468" fill="#0B5D52" font-family="Arial, sans-serif" font-size="13" font-weight="700">MATCH</text>
  </g>

  <text x="82" y="570" fill="#A9CFC6" font-family="Arial, sans-serif" font-size="17">Android 8.0+  /  Kotlin + Compose  /  SigLIP2 + Gemma  /  Apache-2.0</text>
</svg>
